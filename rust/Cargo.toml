[package]
name = "structom"
description = "structom rust crate"
version = "0.3.0"
edition = "2024"
readme = "../readme.md"
license = "MIT"
repository = "https://github.com/aliibrahim123/structom"
documentation = "https://docs.rs/structom/"

[lib]
doctest = true

[dependencies]
compact_str = { version = "0.10.0", default-features = false }
gramex = { version = "0.2.10", features = [
	"str",
	"macros",
], default-features = false, optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = [
	"default-hasher",
] }
indexmap = { version = "2.14.2", default-features = false }
rustc-hash = { version = "2.1.3", default-features = false }
thin-vec = { version = "0.2.21", default-features = false }

[features]
default = ["std"]
std = []
bin = []
parse = ["dep:gramex"]
large-span = []
stringify = []
rich-bitfield = []
rich-unitfield = []
rich-uuid = []
rich-inst = []
rich-dur = []
rich-bint = []
rich-dec = []
rich-color = []
siphash = []
fs-provider = ["std", "parse"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
clippy.pedantic = "deny"
