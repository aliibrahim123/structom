[package]
name = "structom"
description = "structom rust crate"
version = "0.3.0"
edition = "2024"
readme = "../readme.md"
license = "MIT"
repository = "https://github.com/aliibrahim123/structom"
documentation = "https://docs.rs/structom/"

[lib]
doctest = true

[dependencies]
gramex = { version = "0.2.6", features = ["str", "macros"], optional = true }
hashbrown = "0.17.1"
lean_string = "0.8.0"
rustc-hash = "2.1.3"
thin-vec = "0.2.21"

[features]
default = ["std"]
std = []
parse = ["dep:gramex"]
large-span = []
stringify = []
rich-bitfield = []
rich-unitfield = []
rich-uuid = []
rich-inst = []
rich-dur = []
rich-bint = []
rich-dec = []
rich-color = []
fs-provider = ["std", "parse"]
